        <div class="row">
            <h1>Mad Libs</h1>
            <form class="border border-success">
                <div class="border border-warning m-2">
                    <label>Give me a verb</label><br>
                    <input type="text" placeholder="Type a verb here" id="verb">
                </div>
                <div class="border border-warning m-2">
                    <label>Give me a noun</label><br>
                    <input type="text" placeholder="Type a noun here" id="noun">
                </div>
                <div class="border border-warning m-2">
                    <label>Give me a place</label><br>
                    <input type="text" placeholder="Type a place here" id="place">
                </div>
                <div class="border border-warning m-2">
                    <label>Give me an adjective</label><br>
                    <input type="text" placeholder="Type an adjective here" id="adjective">
                </div>
                <div class="border border-warning m-2">
                    <label>Give me an animal</label><br>
                    <input type="text" placeholder="Type an animal here" id="animal">
                </div>
                <div class="border border-warning m-2">
                    <label>Give me an emotion</label><br>
                    <input type="text" placeholder="Type an emotion here" id="emotion">
                </div>

                <button class="ml-2" type="button" onclick="handleMadLibs()">Submit</button>
                <button type="reset">Reset Form</button>

            </form>

            <div id="output" class="mt-4"></div>

        </div>

    <script>
        function handleMadLibs() {
            let verb = document.getElementById("verb").value;
            let noun = document.getElementById("noun").value;
            let place = document.getElementById("place").value;
            let adjective = document.getElementById("adjective").value;
            let animal = document.getElementById("animal").value;
            let emotion = document.getElementById("emotion").value;
            console.log("Grabbed inputs:" + noun);

            let madlibs = noun + " just " + verb + " at the " + place + ". He was with a " + animal + " that was feeling very " + emotion + ". The " + animal + " was " + adjective + ".";

            document.getElementById("output").innerHTML = "<h2>" + madlibs + "</h2>";
        }
    </script>
